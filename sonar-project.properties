sonar.projectKey=plataforma-atencion
sonar.projectName=Plataforma de atención multitenant
sonar.sourceEncoding=UTF-8

# Código fuente de los tres proyectos
sonar.sources=backend,wa-service,frontend/src
sonar.tests=backend,wa-service,frontend/src
sonar.test.inclusions=**/*_test.go,**/*.test.ts,**/*.test.tsx,frontend/src/test/**
sonar.exclusions=**/*_test.go,**/*.test.ts,**/*.test.tsx,frontend/src/test/**,**/node_modules/**,**/dist/**,**/coverage/**,frontend/src/assets/**

# Puntos de entrada y migraciones no se cubren con pruebas unitarias
sonar.coverage.exclusions=**/cmd/**,backend/migrations/**,frontend/src/main.tsx,frontend/src/vite-env.d.ts

# Reportes de cobertura generados en CI
sonar.go.coverage.reportPaths=backend/coverage.out,wa-service/coverage.out
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info

# El pipeline falla si no se cumple el quality gate
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=300
