# Integración continua: calidad, pruebas, SonarQube, SAST y build de imágenes.
# Corre en runners de GitHub; el runner del VPS solo se usa en cd.yml.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend · lint y pruebas
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: owner
          POSTGRES_PASSWORD: owner
          POSTGRES_DB: plataforma_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U owner -d plataforma_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Formato
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - uses: golangci/golangci-lint-action@v8
        with:
          version: latest
          working-directory: backend
      - name: Pruebas unitarias, de integración y de aislamiento
        env:
          TEST_DATABASE_URL: postgres://owner:owner@localhost:5432/plataforma_test?sslmode=disable
        run: go test -race -count=1 -coverpkg=./... -coverprofile=coverage.out ./...
      - name: Resumen de cobertura
        run: go tool cover -func=coverage.out | tail -1
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-backend
          path: backend/coverage.out

  wa-service:
    name: wa-service · lint y pruebas
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: wa-service
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: wa-service/go.mod
          cache: false
      - name: Formato
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - uses: golangci/golangci-lint-action@v8
        with:
          version: latest
          working-directory: wa-service
      - name: Pruebas
        run: go test -race -count=1 -coverprofile=coverage.out ./...
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-wa-service
          path: wa-service/coverage.out

  frontend:
    name: Frontend · lint y pruebas
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:coverage
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-frontend
          path: frontend/coverage/lcov.info

  security:
    name: SAST y dependencias
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache: false
      - name: Secretos en el historial (gitleaks)
        run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:latest git /repo --redact --verbose
      - name: Vulnerabilidades conocidas en Go (govulncheck)
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          (cd backend && govulncheck ./...)
          (cd wa-service && govulncheck ./...)
      - name: Vulnerabilidades en dependencias npm
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high
      - name: Análisis estático de seguridad (Semgrep · OWASP Top 10)
        run: >
          docker run --rm -v "$PWD:/src" semgrep/semgrep semgrep scan
          --config p/owasp-top-ten --config p/golang --config p/react --config p/typescript
          --error --metrics=off --exclude node_modules

  sonarqube:
    name: SonarQube · quality gate
    runs-on: ubuntu-latest
    needs: [backend, wa-service, frontend]
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
    steps:
      - name: Verificar configuración
        id: config
        run: |
          if [ -z "$SONAR_TOKEN" ] || [ -z "$SONAR_HOST_URL" ]; then
            echo "::warning::SonarQube no está configurado (SONAR_TOKEN / SONAR_HOST_URL); se omite el análisis"
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v5
        if: steps.config.outputs.enabled == 'true'
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        if: steps.config.outputs.enabled == 'true'
        with:
          pattern: coverage-*
          path: coverage-artifacts
      - name: Ubicar reportes de cobertura
        if: steps.config.outputs.enabled == 'true'
        run: |
          cp coverage-artifacts/coverage-backend/coverage.out backend/coverage.out
          cp coverage-artifacts/coverage-wa-service/coverage.out wa-service/coverage.out
          mkdir -p frontend/coverage
          cp coverage-artifacts/coverage-frontend/lcov.info frontend/coverage/lcov.info
      - uses: SonarSource/sonarqube-scan-action@v5
        if: steps.config.outputs.enabled == 'true'

  images:
    name: Imagen · ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: [backend, wa-service, frontend, security, sonarqube]
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service: [backend, wa-service, frontend]
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - name: Nombre de la imagen
        id: meta
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "image=ghcr.io/${owner}/plataforma-${{ matrix.service }}" >> "$GITHUB_OUTPUT"
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.service }}
          load: true
          tags: ${{ steps.meta.outputs.image }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
      - name: Escaneo de vulnerabilidades de la imagen (Trivy)
        run: >
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:latest image
          --exit-code 1 --severity CRITICAL,HIGH --ignore-unfixed --no-progress
          ${{ steps.meta.outputs.image }}:${{ github.sha }}
      - name: Publicar en GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker tag "${{ steps.meta.outputs.image }}:${{ github.sha }}" "${{ steps.meta.outputs.image }}:main"
          docker push "${{ steps.meta.outputs.image }}:${{ github.sha }}"
          docker push "${{ steps.meta.outputs.image }}:main"
