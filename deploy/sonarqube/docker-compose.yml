# SonarQube Community en el VPS. Requisitos del host (una sola vez):
#   sudo sysctl -w vm.max_map_count=524288
#   sudo sysctl -w fs.file-max=131072
#   (y agregarlos a /etc/sysctl.d/99-sonarqube.conf para que persistan)
# Levantar:
#   docker compose --env-file /opt/plataforma/sonarqube.env up -d
name: sonarqube

services:
  sonarqube:
    image: sonarqube:community
    restart: unless-stopped
    depends_on:
      sonar-db:
        condition: service_healthy
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://sonar-db:5432/sonar
      SONAR_JDBC_USERNAME: sonar
      SONAR_JDBC_PASSWORD: ${SONAR_DB_PASSWORD:?}
    volumes:
      - sonar_data:/opt/sonarqube/data
      - sonar_extensions:/opt/sonarqube/extensions
      - sonar_logs:/opt/sonarqube/logs
    ulimits:
      nofile: { soft: 131072, hard: 131072 }
    mem_limit: 3g
    networks: [sonar, edge]

  sonar-db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: sonar
      POSTGRES_USER: sonar
      POSTGRES_PASSWORD: ${SONAR_DB_PASSWORD:?}
    volumes:
      - sonar_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sonar -d sonar"]
      interval: 5s
      retries: 20
    networks: [sonar]

networks:
  sonar: {}
  edge:
    external: true

volumes:
  sonar_data:
  sonar_extensions:
  sonar_logs:
  sonar_db:
