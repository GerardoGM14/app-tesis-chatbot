# Configuración compartida por backend/ y wa-service/ (golangci-lint v2).
version: "2"

run:
  timeout: 5m

linters:
  default: standard
  enable:
    - bodyclose
    - dupl
    - errorlint
    - gocognit
    - gosec
    - noctx
    - nolintlint
    - rowserrcheck
    - sqlclosecheck
    - unconvert
  settings:
    gocognit:
      # Mismo umbral de complejidad cognitiva que SonarQube.
      min-complexity: 15
    nolintlint:
      require-explanation: true
      require-specific: true
  exclusions:
    presets:
      - comments
      - std-error-handling
    rules:
      - path: _test\.go
        linters: [dupl, gosec, noctx, gocognit]

formatters:
  enable:
    - gofmt
